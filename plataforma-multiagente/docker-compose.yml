# Plataforma multi-agente: OLMo 3 + Conway Automaton + LangGraph (+ n8n / OmniRoute opcionais).
#
#   cp .env.example .env        # COMPOSE_PROFILES escolhe os serviços opcionais
#   docker compose up -d --build
#
# Perfis (COMPOSE_PROFILES no .env, separados por vírgula):
#   ollama     OLMo via Ollama (CPU ou GPU; padrão)
#   vllm       OLMo via vLLM (GPU NVIDIA obrigatória)
#   omniroute  gateway OmniRoute na frente do LLM (fallback/roteamento)
#   n8n        editor de fluxos visuais
#
# GPU para o Ollama: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# UI: http://localhost:8080

name: plataforma-multiagente

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ─── LLM ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
    profiles: ["ollama"]

  # Baixa o modelo uma vez (≈19 GB para o 32B quantizado) e sai.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-olmo-3.1:32b-instruct}"]
    restart: "no"
    profiles: ["ollama"]

  # Alternativa de produção com GPU: pesos oficiais da AI2 em BF16/FP8.
  vllm:
    image: vllm/vllm-openai:${VLLM_VERSION:-latest}
    restart: unless-stopped
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model=${VLLM_MODEL:-allenai/Olmo-3.1-32B-Instruct}
      - --served-model-name=${VLLM_SERVED_NAME:-olmo-3-32b}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-32768}
      - --tensor-parallel-size=${VLLM_TP:-1}
      - --enable-auto-tool-choice
      - --tool-call-parser=olmo3
    ports:
      - "127.0.0.1:8001:8000"
    profiles: ["vllm"]
    <<: *gpu

  # Gateway OpenAI-compatível com fallback/balanceamento entre provedores.
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    restart: unless-stopped
    environment:
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_PASSWORD:-}
      OMNIROUTE_LOCAL_DIRECT_HEADERS_TIMEOUT_MS: "600000"
      STREAM_IDLE_TIMEOUT_MS: "600000"
    volumes:
      - omniroute:/app/data
    ports:
      - "127.0.0.1:20128:20128"
    profiles: ["omniroute"]

  # ─── Plataforma ─────────────────────────────────────────────────────
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_URL: http://automaton-runner:7000
      DB_PATH: /data/platform.db
    volumes:
      - platform:/data
    ports:
      - "${UI_BIND:-127.0.0.1}:8080:8000"

  automaton-runner:
    build: ./automaton-runner
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      RUNNER_TOKEN: ${RUNNER_TOKEN:?defina RUNNER_TOKEN no .env}
    volumes:
      - agents:/data
    # Sem portas publicadas: só o control plane fala com o runner.

  # ─── Fluxos visuais (opcional) ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      PLATFORM_URL: http://control-plane:8000
      PLATFORM_TOKEN: ${ADMIN_TOKEN:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    profiles: ["n8n"]

volumes:
  ollama:
  hf-cache:
  omniroute:
  platform:
  agents:
  n8n:

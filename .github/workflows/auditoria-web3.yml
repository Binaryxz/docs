name: Auditoria Web3

# Actions → "Auditoria Web3" → Run workflow → cole o link do GitHub.
on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repositório a auditar (https://github.com/org/repo) , pasta ou .zip deste branch (ex: Mova-main.zip)"
        required: true
      ref:
        description: "Branch, tag ou commit (vazio = branch padrão)"
        required: false
        default: ""
      etapas:
        description: "Só estas etapas, separadas por vírgula (vazio = todas)"
        required: false
        default: ""
      medusa_timeout:
        description: "Tempo de fuzzing do Medusa em segundos"
        required: false
        default: "900"
      onchain_enderecos:
        description: "Contratos implantados a inspecionar (endereço[=rótulo], separados por vírgula)"
        required: false
        default: ""
      onchain_rpc:
        description: "RPC da rede desses contratos (ex: https://ethereum-sepolia-rpc.publicnode.com)"
        required: false
        default: ""
      circom_mains:
        description: "Componentes main extras dos circuitos (JSON no formato do circuits.json, file relativo à raiz)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem de ferramentas
        uses: docker/build-push-action@v6
        with:
          context: auditoria-web3
          load: true
          tags: auditoria-web3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rodar auditoria
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REF: ${{ inputs.ref }}
          ETAPAS: ${{ inputs.etapas }}
          MEDUSA_TIMEOUT: ${{ inputs.medusa_timeout }}
          ONCHAIN_ENDERECOS: ${{ inputs.onchain_enderecos }}
          ONCHAIN_RPC: ${{ inputs.onchain_rpc }}
          CIRCOM_MAINS: ${{ inputs.circom_mains }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ETHSCAN_API_KEY: ${{ secrets.ETHSCAN_API_KEY }}
          ANTICAPTURE_MCP_API_KEY: ${{ secrets.ANTICAPTURE_MCP_API_KEY }}
          AUDIT_GITHUB_TOKEN: ${{ secrets.AUDIT_GITHUB_TOKEN }}
          QUORUM_PAYLOADS: ${{ vars.QUORUM_PAYLOADS }}
          QUORUM_PROTOCOLO: ${{ vars.QUORUM_PROTOCOLO }}
          QUORUM_REDE: ${{ vars.QUORUM_REDE }}
          DAO_ID: ${{ vars.DAO_ID }}
          NODEPROBE_WEB: ${{ vars.NODEPROBE_WEB }}
          NODEPROBE_RPC: ${{ vars.NODEPROBE_RPC }}
        run: |
          mkdir -p resultados
          monta=()
          if [[ "$REPO_URL" == https://* ]]; then
            alvo="$REPO_URL"
          elif [[ "$REPO_URL" == *.zip ]]; then
            # .zip versionado neste branch: extraído fora do checkout e montado no container.
            [[ "$REPO_URL" =~ ^[A-Za-z0-9_./-]+$ && "$REPO_URL" != *..* && -f "$REPO_URL" ]] \
              || { echo "Zip inválido: $REPO_URL"; exit 1; }
            d="$RUNNER_TEMP/alvo"
            mkdir -p "$d" && unzip -q "$REPO_URL" -d "$d"
            # Um zip do GitHub traz uma única pasta raiz (ex.: Mova-main/): audita o conteúdo dela.
            if [ "$(ls -A "$d" | wc -l)" -eq 1 ] && [ -d "$d/$(ls -A "$d")" ]; then d="$d/$(ls -A "$d")"; fi
            alvo=/alvo
            monta=(-v "$d:/alvo")
          else
            # Pasta versionada neste branch (código recebido em .zip, por exemplo).
            [[ "$REPO_URL" =~ ^[A-Za-z0-9_./-]+$ && "$REPO_URL" != *..* && -d "$REPO_URL" ]] \
              || { echo "Pasta inválida: $REPO_URL"; exit 1; }
            alvo=/alvo
            monta=(-v "$PWD/$REPO_URL:/alvo")
          fi
          args=("$alvo" --saida /resultados/auditoria)
          [ -n "$REF" ] && args+=(--ref "$REF")
          [ -n "$ETAPAS" ] && args+=(--etapas "$ETAPAS")
          docker run --rm \
            -e ANTHROPIC_API_KEY -e OPENAI_API_KEY -e ETHSCAN_API_KEY -e ANTICAPTURE_MCP_API_KEY \
            -e GITHUB_TOKEN="$AUDIT_GITHUB_TOKEN" -e MEDUSA_TIMEOUT -e ONCHAIN_ENDERECOS -e ONCHAIN_RPC -e CIRCOM_MAINS \
            -e QUORUM_PAYLOADS -e QUORUM_PROTOCOLO -e QUORUM_REDE -e DAO_ID \
            -e NODEPROBE_WEB -e NODEPROBE_RPC \
            -v "$PWD/resultados:/resultados" "${monta[@]}" auditoria-web3:ci "${args[@]}"

      - name: Resumo
        if: always()
        run: |
          f=resultados/auditoria/RELATORIO.md
          [ -f "$f" ] && head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY" || echo "Relatório não gerado" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-web3
          path: |
            resultados/auditoria
            !resultados/auditoria/repo
          retention-days: 30
